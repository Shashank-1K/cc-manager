<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cc-manager Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <nav id="sidebar">
      <div class="sidebar-header">
        <span class="logo">⚡</span>
        <span class="logo-text">cc-manager</span>
      </div>
      <ul class="nav-links">
        <li><a href="#overview" class="nav-link active" data-section="overview">Dashboard</a></li>
        <li><a href="#profiles" class="nav-link" data-section="profiles">Profiles</a></li>
        <li><a href="#keys" class="nav-link" data-section="keys">API Keys</a></li>
        <li><a href="#providers" class="nav-link" data-section="providers">Providers</a></li>
        <li><a href="#health" class="nav-link" data-section="health">Proxy Health</a></li>
        <li><a href="#analytics" class="nav-link" data-section="analytics">Analytics</a></li>
        <li><a href="#models" class="nav-link" data-section="models">Models</a></li>
        <li><a href="#doctor" class="nav-link" data-section="doctor">Doctor</a></li>
        <li><a href="#settings" class="nav-link" data-section="settings">Settings</a></li>
      </ul>
      <div class="sidebar-footer">
        <button id="theme-toggle" class="theme-btn" title="Toggle dark mode">🌙</button>
        <span class="version">v2.0.0</span>
      </div>
    </nav>
    <main id="content">
      <header id="header">
        <h1 id="page-title">Dashboard</h1>
        <div id="header-actions"></div>
      </header>
      <div id="page-content"></div>
    </main>
  </div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal" class="modal">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button id="modal-close" class="modal-close">&times;</button>
      </div>
      <div id="modal-body"></div>
      <div class="modal-footer">
        <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
        <button id="modal-save" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <script src="/js/app.js"></script>
  <script src="/js/pages.js"></script>
</body>
</html>
